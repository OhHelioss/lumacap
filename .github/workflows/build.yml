name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Build installer
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\lumacap.iss
          if (-not (Test-Path dist\Lumacap-Setup.exe)) { throw "installer was not built" }
      - uses: actions/upload-artifact@v4
        with:
          name: lumacap-windows-x64
          path: |
            target/release/lumacap.exe
            dist/Lumacap-Setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/lumacap.exe
            dist/Lumacap-Setup.exe
